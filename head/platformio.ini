; PlatformIO Project Configuration File for wibeSlam Head (ESP32-S3)
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Monitor settings
monitor_speed = 115200

; Build flags
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Library dependencies
lib_deps = 
    ; micro-ROS Arduino (Humble)
    ; Note: may need to install manually or use specific fork
    https://github.com/micro-ROS/micro_ros_arduino/archive/refs/tags/v2.0.8-humble.zip
    
    ; Arduino GFX Library for display
    moononournation/GFX Library for Arduino@^1.4.5
    
    ; Adafruit GFX Library (dependency for Arduino_GFX)
    adafruit/Adafruit GFX Library@^1.12.6
    
    ; LDS LD14P LiDAR library
    ; TODO: Find correct repo for LDS_LDROBOT_LD14P
    ; For now using placeholder - user needs to provide correct URL
    ; https://github.com/RELLKO/LDS_LDROBOT_LD14P/archive/refs/heads/main.zip
    
    ; Wire.h is built-in with ESP32 framework
    ; WiFi.h is built-in with ESP32 framework  
    ; Preferences.h is built-in with ESP32 framework

; Upload settings
upload_speed = 921600

; Board-specific defines
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
