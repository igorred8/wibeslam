; PlatformIO проект для "head" (ESP32-S3, ST7789 240x320, QMI8658, micro-ROS)
; Сборка:  pio run -e esp32s3
; Прошивка: pio run -t upload --upload-port COM3   (Windows) / /dev/ttyUSB0 (Linux)

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wno-deprecated-declarations
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.6
    adafruit/Adafruit GFX Library @ ^1.11.17
    kaiaai/LDS @ ^0.6.3
    ; micro-ROS для ESP32-S3: скачайте precompiled-binary zip с
    ; https://github.com/micro-ROS/micro_ros_arduino/releases (например humble)
    ; и распакуйте его содержимое в lib/micro_ros_arduino/
extra_scripts = pre:add_microros.py
